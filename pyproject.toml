[project]
name = "abcnewsheadlines"
version = "0.1.0"
description = "Unofficial monitor for headline edits on abc.net.au."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "atproto>=0.0.73",  # poster.py: the Bluesky client
    "font-source-serif-pro>=0.0.1",  # poster.py: the font for the diff / thumbnail images (SIL OFL)
    "httpx>=0.28",
    "pillow>=12",  # poster.py: renders the diff / thumbnail images
]

[tool.uv]
package = false  # a script project, not an installable package
